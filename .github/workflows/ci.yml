name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"

jobs:
  javascript:
    name: API and web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @deepfake/api prisma:generate

      - name: Typecheck API
        run: pnpm --filter @deepfake/api typecheck

      - name: Build API
        run: pnpm --filter @deepfake/api build

      - name: Test API
        run: pnpm --filter @deepfake/api test

      - name: Typecheck web
        run: pnpm --filter @deepfake/web typecheck

      - name: Lint web
        run: pnpm --filter @deepfake/web lint

      - name: Build web
        run: pnpm --filter @deepfake/web build

      - name: Install Playwright browser
        run: pnpm --filter @deepfake/web exec playwright install --with-deps chromium

      - name: Playwright smoke tests
        run: pnpm --filter @deepfake/web exec playwright test e2e/public.spec.ts e2e/auth.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  ml-service:
    name: ML service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/ml/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose --env-file .env -f infra/docker-compose.yml config --quiet
