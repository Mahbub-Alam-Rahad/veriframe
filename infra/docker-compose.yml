name: veriframe

# Shared by the API, worker and migration/seed job. Values interpolate from the
# repository .env file. Run Compose with `--env-file .env` (the Makefile does).
x-app-env: &app-env
  NODE_ENV: production
  APP_NAME: ${APP_NAME:-VeriFrame}
  API_PORT: "3001"
  PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
  DATABASE_URL: postgresql://${POSTGRES_USER:-deepfake}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-deepfake}?schema=public
  REDIS_URL: redis://redis:6379
  QUEUE_PREFIX: ${QUEUE_PREFIX:-deepfake}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
  ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
  REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-30d}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  TRUST_PROXY: ${TRUST_PROXY:-1}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
  ADMIN_NAME: ${ADMIN_NAME:-Platform Admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
  S3_BUCKET: ${S3_BUCKET:-deepfake}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  ML_SERVICE_URL: http://ml:8000
  ML_INTERNAL_TOKEN: ${ML_INTERNAL_TOKEN:?set ML_INTERNAL_TOKEN in .env}
  ML_TIMEOUT_MS: ${ML_TIMEOUT_MS:-900000}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: "${SMTP_FROM:-VeriFrame <no-reply@example.com>}"
  EXPOSE_DEV_TOKENS: ${COMPOSE_EXPOSE_DEV_TOKENS:-false}
  RETENTION_DAYS: ${RETENTION_DAYS:-30}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2147483648}
  FREE_MONTHLY_ANALYSES: ${FREE_MONTHLY_ANALYSES:-3}
  PRO_MONTHLY_ANALYSES: ${PRO_MONTHLY_ANALYSES:-100}
  ENTERPRISE_MONTHLY_ANALYSES: ${ENTERPRISE_MONTHLY_ANALYSES:-2000}
  SWAGGER_ENABLED: ${COMPOSE_SWAGGER_ENABLED:-false}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  UPLOAD_TMP_DIR: /tmp/deepfake-uploads

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16.16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deepfake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-deepfake}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      ["redis-server", "--appendonly", "yes", "--save", "60", "1000", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    networks: [backend]

  minio:
    # Upstream MinIO stopped publishing community container images in Oct 2025.
    # This is the maintained community build, pinned to a release tag.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    ports:
      - "${MINIO_BIND:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${MINIO_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    logging: *default-logging
    networks: [backend]

  minio-init:
    image: pgsty/mc:RELEASE.2026-08-04T00-00-00Z
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until mc alias set local "http://minio:9000" "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "waiting for MinIO"
          sleep 2
        done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET" || true
        echo "object storage ready: $$S3_BUCKET"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-deepfake}
    depends_on:
      minio:
        condition: service_started
    logging: *default-logging
    networks: [backend]

  migrate:
    image: veriframe-api:local
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: "no"
    command:
      ["/bin/sh", "-c", "./node_modules/.bin/prisma migrate deploy && node prisma/seed.js"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    networks: [backend]

  api:
    image: veriframe-api:local
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    logging: *default-logging
    networks: [backend]

  worker:
    image: veriframe-api:local
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      ml:
        condition: service_healthy
    logging: *default-logging
    networks: [backend]

  ml:
    image: veriframe-ml:local
    build:
      context: ../services/ml
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ML_INTERNAL_TOKEN: ${ML_INTERNAL_TOKEN:?set ML_INTERNAL_TOKEN in .env}
      MODEL_BACKEND: ${MODEL_BACKEND:-mock}
      MODEL_ID: ${MODEL_ID:-dima806/deepfake_vs_real_image_detection}
      MODEL_DEVICE: ${MODEL_DEVICE:-cpu}
      MODEL_CALIBRATION_TEMPERATURE: ${MODEL_CALIBRATION_TEMPERATURE:-1.0}
      FAKE_LABEL_INDEX: ${FAKE_LABEL_INDEX:-1}
      ALLOW_MOCK_FALLBACK: ${ALLOW_MOCK_FALLBACK:-true}
      HF_HOME: /models/hf-cache
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-false}
      HF_TRUST_REMOTE_CODE: ${HF_TRUST_REMOTE_CODE:-false}
      SAMPLE_FPS: ${SAMPLE_FPS:-1.0}
      MAX_FRAMES: ${MAX_FRAMES:-120}
      MAX_VIDEO_SECONDS: ${MAX_VIDEO_SECONDS:-600}
      MAX_CONCURRENT_ANALYSES: ${MAX_CONCURRENT_ANALYSES:-1}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-deepfake}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    volumes:
      - ml-models:/models
    depends_on:
      minio-init:
        condition: service_completed_successfully
    logging: *default-logging
    networks: [backend]

  web:
    image: veriframe-web:local
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:3001
        NEXT_PUBLIC_API_BASE: /api/v1
        NEXT_PUBLIC_APP_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:3001
      NEXT_PUBLIC_API_BASE: /api/v1
      NEXT_PUBLIC_APP_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging
    networks: [backend]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost:3000}
      ACME_EMAIL: ${ACME_EMAIL:-internal@localhost}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
      # Local default: SITE_ADDRESS is http://localhost:3000, so Caddy listens
      # on 3000 inside the container.
      - "3000:3000"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    logging: *default-logging
    networks: [backend]

  # --- Optional: scheduled backups -----------------------------------------
  backup-db:
    profiles: ["backup"]
    image: postgres:16.16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/db-backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-deepfake}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-deepfake}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backup/db-backup.sh:/scripts/db-backup.sh:ro
      - ../backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    networks: [backend]

  backup-media:
    profiles: ["backup"]
    image: pgsty/mc:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/media-backup.sh"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-deepfake}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backup/media-backup.sh:/scripts/media-backup.sh:ro
      - ../backups:/backups
    depends_on:
      minio:
        condition: service_started
    logging: *default-logging
    networks: [backend]

  # --- Optional: model experiment tracking --------------------------------
  mlflow:
    profiles: ["mlflow"]
    image: ghcr.io/mlflow/mlflow:v2.18.0
    restart: unless-stopped
    command:
      [
        "mlflow",
        "server",
        "--host",
        "0.0.0.0",
        "--port",
        "5000",
        "--backend-store-uri",
        "sqlite:////mlflow/mlflow.db",
        "--default-artifact-root",
        "/mlflow/artifacts",
      ]
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow
    logging: *default-logging
    networks: [backend]

  # --- Optional: Prometheus + Grafana -------------------------------------
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    logging: *default-logging
    networks: [backend]

  postgres-exporter:
    profiles: ["monitoring"]
    image: prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-deepfake}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-deepfake}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    networks: [backend]

  redis-exporter:
    profiles: ["monitoring"]
    image: oliver006/redis_exporter:v1.67.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging
    networks: [backend]

  blackbox-exporter:
    profiles: ["monitoring"]
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    logging: *default-logging
    networks: [backend]

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3002}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    logging: *default-logging
    networks: [backend]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  ml-models:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
  mlflow-data:

networks:
  backend:
    driver: bridge
